# MySQL 8.0 connection used by DAO8.
# These defaults match docker-compose.yml (user cinema / password cinema).
# Override with the CINEMA_DB_URL, CINEMA_DB_USER and CINEMA_DB_PASSWORD
# environment variables when using a local MySQL installation.
db.url=jdbc:mysql://localhost:3306/cinema?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&useSSL=false&allowPublicKeyRetrieval=true
db.user=cinema
db.password=cinema
